# Monthly update PRs, grouped so each ecosystem opens one. They run CI (ci.yml) and deploy
# nothing until merged to main.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Pinned to a master commit by hand; see migrate.yml.
      - dependency-name: "superfly/flyctl-actions*"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # TipTap's packages pin each other's exact version, so they move together.
      tiptap:
        patterns: ["@tiptap/*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Its types follow the Node that runs the app (22: ci.yml, Dockerfile); move it when Node moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native compiler; revisit when Vite and oxlint support it (#39).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # These ship with .NET and stay on its major (net10.0, global.json) until a deliberate .NET 11 move.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
