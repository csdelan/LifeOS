name: CI

# PR gate: test the kernel, build the SPA, build the deployable image (no push).
# Does not migrate and does not deploy. The image does not need Supabase
# public values at build time; those are runtime env / Fly secrets.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: |
          export TESTINGPLATFORM_TELEMETRY_OPTOUT=1
          dotnet run --project tests/LifeOs.Tests/LifeOs.Tests.csproj --configuration Release

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: lifeos:ci
          build-args: |
            VITE_API_BASE_URL=/
