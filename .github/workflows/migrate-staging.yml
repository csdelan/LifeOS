name: Migrate staging (Supabase)

# Manual / compatibility entry point. Merge-to-main promotions now go through
# .github/workflows/deploy.yml (migrate, then Fly deploy). This workflow still
# runs `bsk migrate` against the `staging` GitHub Environment on demand.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  migrate:
    uses: ./.github/workflows/migrate.yml
    with:
      environment: staging
      deploy: false
    secrets: inherit
