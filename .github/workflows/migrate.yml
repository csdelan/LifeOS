name: Release environment

# Reusable job: apply schema with `bsk migrate` (the only schema authority),
# then optionally build and deploy the Fly app. Staging and production both
# use this workflow. Production is gated by the GitHub Environment reviewer.
#
# Order is migrate-then-deploy on purpose. The running API never migrates.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment (staging or production)
        required: true
        type: string
      deploy:
        description: After migrating, deploy the Fly app for this environment
        required: false
        type: boolean
        default: false
      fly_config:
        description: fly.toml path used when deploy is true
        required: false
        type: string
        default: fly.toml
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to migrate
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      deploy:
        description: Also deploy the Fly app after migrating
        required: false
        type: boolean
        default: false
      fly_config:
        description: fly.toml path (fly.staging.toml or fly.toml)
        required: false
        type: string
        default: fly.toml

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Refuse a ref that isn't main or a release tag
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) ;;
            *)
              echo "::error::${{ inputs.environment }} gets migrations only from main (or a v* tag), not $GITHUB_REF. A branch's migration that later changes or is renumbered breaks every later deploy."
              exit 1
              ;;
          esac

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Apply migrations with bsk migrate
        env:
          BSK_CONNECTION_STRING: ${{ secrets.BSK_CONNECTION_STRING }}
        run: |
          if [ -z "$BSK_CONNECTION_STRING" ]; then
            echo "::error::BSK_CONNECTION_STRING is not set for the '${{ inputs.environment }}' environment. Add the Supabase session-pooler (port 5432) owner connection string under Settings → Environments → ${{ inputs.environment }} → Secrets."
            exit 1
          fi
          dotnet run --project src/LifeOs.Cli/LifeOs.Cli.csproj --configuration Release -- migrate --json

      - name: Set up flyctl
        if: ${{ inputs.deploy }}
        # A commit on master, pinned by hand (Dependabot leaves it alone): the last release,
        # 1.5, still runs on Node 20, which GitHub is retiring. Bump it to a newer commit or a
        # release on Node 24.
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master, 2026-10-30

      - name: Deploy to Fly
        if: ${{ inputs.deploy }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is not set on the '${{ inputs.environment }}' environment. Run scripts/fly-setup.ps1 for this environment (it mints an app-scoped deploy token and stores it here)."
            exit 1
          fi
          flyctl deploy \
            --config "${{ inputs.fly_config }}" \
            --remote-only
